# SoundForge — Codemagic CI
#
#   ios-soundforge            signed ad-hoc IPA (App Store Connect integration + a registered device)
#   ios-soundforge-unsigned   unsigned IPA for sideloading (no Apple account needed)
#   web                       plain web bundle, no Mac minutes burned
#
# There is no committed Xcode project — Capacitor generates ios/ during the
# build from the Vite output in dist/.
#
# ios-soundforge prerequisites (see notes at the bottom of this file):
#   1. At least one iOS device UDID registered on the Apple Developer account.
#   2. CERTIFICATE_PRIVATE_KEY set in Codemagic env (group: appstore) so the
#      CLI can create/reuse a distribution certificate.

workflows:

  ios-soundforge:
    name: SoundForge iOS (signed)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.kingtweak69.soundforge"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install Node dependencies
        script: npm install --no-audit --no-fund

      - name: Build web app
        script: npm run build:web

      - name: Verify the bundle is real
        script: |
          test -f dist/index.html || { echo "No dist/index.html — vite build produced nothing"; exit 1; }
          CSS=$(find dist/assets -name '*.css' | head -1)
          SIZE=$(wc -c < "$CSS")
          echo "CSS bundle: $SIZE bytes"
          if [ "$SIZE" -lt 20000 ]; then
            echo "CSS is only $SIZE bytes — Tailwind scanned nothing. Check the content globs in tailwind.config.js."
            exit 1
          fi
          grep -q createStereoPanner dist/assets/*.js || { echo "Audio engine missing from the bundle"; exit 1; }

      - name: Create iOS project
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Force the bundle identifier into the Xcode project
        script: |
          cd ios/App
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" App.xcodeproj/project.pbxproj
          grep -m1 PRODUCT_BUNDLE_IDENTIFIER App.xcodeproj/project.pbxproj

      - name: Add microphone and audio permissions
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'SoundForge uses the microphone to record vocal takes into your project.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"

      - name: Report registered devices
        script: |
          echo "--- devices on the account (ad-hoc profiles need at least one) ---"
          app-store-connect devices list --platform IOS 2>&1 | tail -40 || echo "device listing failed — continuing"

      - name: Initialize keychain
        script: keychain initialize

      - name: Fetch or create signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_ADHOC --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply iOS signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-soundforge-unsigned:
    name: SoundForge iOS (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.kingtweak69.soundforge"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install Node dependencies
        script: npm install --no-audit --no-fund

      - name: Build web app
        script: npm run build:web

      - name: Verify the bundle is real
        script: |
          test -f dist/index.html || { echo "No dist/index.html — vite build produced nothing"; exit 1; }
          CSS=$(find dist/assets -name '*.css' | head -1)
          SIZE=$(wc -c < "$CSS")
          echo "CSS bundle: $SIZE bytes"
          if [ "$SIZE" -lt 20000 ]; then
            echo "CSS is only $SIZE bytes — Tailwind scanned nothing. Check the content globs in tailwind.config.js."
            exit 1
          fi
          grep -q createStereoPanner dist/assets/*.js || { echo "Audio engine missing from the bundle"; exit 1; }

      - name: Create iOS project
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Force the bundle identifier into the Xcode project
        script: |
          cd ios/App
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" App.xcodeproj/project.pbxproj
          grep -m1 PRODUCT_BUNDLE_IDENTIFIER App.xcodeproj/project.pbxproj

      - name: Add microphone and audio permissions
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'SoundForge uses the microphone to record vocal takes into your project.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"

      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        script: |
          APP=$(find build/dd -name 'App.app' -type d | head -1)
          test -n "$APP" || { echo "No App.app produced"; exit 1; }
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          rm -rf build/Payload/App.app/_CodeSignature
          cd build && zip -qry SoundForge-unsigned.ipa Payload
          ls -lh SoundForge-unsigned.ipa
    artifacts:
      - build/*.ipa
      - /tmp/xcodebuild_logs/*.log

  web:
    name: SoundForge web bundle
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      node: 20
    scripts:
      - name: Install Node dependencies
        script: npm install --no-audit --no-fund

      - name: Build web app
        script: npm run build:web

      - name: Verify the bundle is real
        script: |
          CSS=$(find dist/assets -name '*.css' | head -1)
          SIZE=$(wc -c < "$CSS")
          echo "CSS bundle: $SIZE bytes"
          test "$SIZE" -ge 20000 || { echo "Tailwind scanned nothing — check content globs"; exit 1; }

      - name: Zip the bundle
        script: cd dist && zip -qry ../SoundForge-web.zip .
    artifacts:
      - SoundForge-web.zip

# ---------------------------------------------------------------------------
# Why the old ios-soundforge failed
#
# The environment.ios_signing: block is Codemagic's automatic signing. It looks
# up a provisioning profile that already exists for the bundle id + distribution
# type. Nothing had ever created one for com.kingtweak69.soundforge, so the
# lookup came back empty:
#
#   No matching profiles found for bundle identifier "com.kingtweak69.soundforge"
#   and distribution type "ad_hoc"
#
# This config drops ios_signing: and calls the CLI directly with --create, which
# registers the App ID and generates the profile on the spot.
#
# Two things --create still cannot invent for you:
#
#   1. A registered device. Apple will not issue an ad-hoc profile for a team
#      with zero devices. Register one from any machine that has the CLI:
#        app-store-connect devices register --name iphone --platform IOS --udid YOUR_UDID
#      Or add the UDID at developer.apple.com under Devices.
#
#   2. A distribution certificate with a private key Codemagic can reach. Set
#      CERTIFICATE_PRIVATE_KEY in the "appstore" env group (an RSA private key).
#      Generate one with:
#        ssh-keygen -t rsa -b 2048 -m PEM -f cert_key -q -N ""
#      and paste the contents of cert_key into the variable, marked secure.
# ---------------------------------------------------------------------------
